hydra:
  run:
    dir: ${output_dir}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath:
  - pkg://navsim.planning.script.config.common
  callbacks: {}
  output_subdir: ${output_dir}/code/hydra
  overrides:
    hydra:
    - hydra.mode=RUN
    task:
    - agent=drivesuprim_agent_r34
    - train_test_split=navtest_debug
    - agent.checkpoint_path=/auto/ws/drivesuprim_workspace/exp_v2/model_ckpt/drivesuprim_r34.ckpt
    - agent.config.training=false
    - agent.config.only_ori_input=true
    - agent.config.inference.model=teacher
    - agent.config.inference.save_pickle=true
    - agent.config.refinement.use_multi_stage=true
    - agent.config.refinement.num_refinement_stage=1
    - agent.config.refinement.stage_layers=3
    - agent.config.refinement.topks=256
    - experiment_name=model_ckpt/test-drivesuprim_r34
    - metric_cache_path=/auto/ws/drivesuprim_workspace/exp_v2/metric_cache/test/ori
  job:
    name: run_create_submission_pickle
    chdir: false
    override_dirname: agent.checkpoint_path=/auto/ws/drivesuprim_workspace/exp_v2/model_ckpt/drivesuprim_r34.ckpt,agent.config.inference.model=teacher,agent.config.inference.save_pickle=true,agent.config.only_ori_input=true,agent.config.refinement.num_refinement_stage=1,agent.config.refinement.stage_layers=3,agent.config.refinement.topks=256,agent.config.refinement.use_multi_stage=true,agent.config.training=false,agent=drivesuprim_agent_r34,experiment_name=model_ckpt/test-drivesuprim_r34,metric_cache_path=/auto/ws/drivesuprim_workspace/exp_v2/metric_cache/test/ori,train_test_split=navtest_debug
    id: ???
    num: ???
    config_name: default_run_create_submission_pickle
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.2.0
    version_base: '1.2'
    cwd: /auto/ws/drivesuprim_workspace/DriveSuprim
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /auto/ws/drivesuprim_workspace/DriveSuprim/navsim/planning/script/config/pdm_scoring
      schema: file
      provider: main
    - path: navsim.planning.script.config.common
      schema: pkg
      provider: hydra.searchpath in main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /auto/ws/drivesuprim_workspace/DriveSuprim/$/auto/ws/drivesuprim_workspace/exp_v2/model_ckpt/test-drivesuprim_r34/2026.09.08.20.42.54
    choices:
      agent: drivesuprim_agent_r34
      worker: ray_distributed_no_torch
      train_test_split: navtest_debug
      train_test_split/scene_filter: navtest_debug
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
